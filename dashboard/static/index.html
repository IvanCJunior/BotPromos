<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotPromos</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #18212f; }
        header { background: #111827; color: white; padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 24px; }
        .online { color: #047857; background: #ecfdf5; padding: 5px 9px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        main { max-width: 1200px; margin: 28px auto; padding: 0 20px; }
        .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 22px; }
        .card, .tabela { background: white; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 3px 12px rgba(0,0,0,.04); }
        .card { padding: 20px; }
        .card small { display: block; color: #6b7280; margin-bottom: 8px; }
        .card strong { font-size: 30px; }
        .filtros { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 12px; }
        input, select { width: 100%; min-width: 0; padding: 12px; border: 1px solid #d1d5db; border-radius: 9px; background: white; color: #18212f; }
        button { padding: 12px 18px; border: 0; border-radius: 9px; background: #111827; color: white; cursor: pointer; }
        button:hover { background: #374151; }
        .acoes { display: flex; gap: 10px; margin-bottom: 18px; }
        .resultado { color: #6b7280; font-size: 13px; margin-bottom: 12px; }
        .tabela { overflow: hidden; }
        .tabela-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 13px; border-bottom: 1px solid #eef0f3; font-size: 14px; vertical-align: top; }
        th { background: #f9fafb; color: #4b5563; }
        .mensagem { max-width: 430px; white-space: pre-line; overflow-wrap: anywhere; }
        .preco, .cupom { font-weight: bold; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .muted { color: #6b7280; }
        @media (max-width: 1000px) { .filtros { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 600px) {
            header { padding: 18px; }
            main { padding: 0 12px; }
            .cards { grid-template-columns: 1fr; }
            .filtros { grid-template-columns: 1fr; }
            .acoes button { flex: 1; }
        }

        .modal-detalhes[hidden] { display: none !important; }
        .modal-detalhes {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(15, 23, 42, .65);
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-conteudo {
            background: white; color: #18212f; width: 100%;
            max-width: 850px; max-height: 90vh; overflow-y: auto;
            border-radius: 12px; padding: 24px;
            box-shadow: 0 15px 50px rgba(0,0,0,.25);
        }
        .modal-cabecalho {
            display: flex; justify-content: space-between;
            align-items: center; gap: 12px; margin-bottom: 20px;
        }
        .modal-cabecalho h2 { margin: 0; font-size: 22px; }
        .modal-cabecalho button {
            padding: 9px 12px; cursor: pointer; border: 1px solid #d1d5db;
            border-radius: 8px; background: white;
        }
        .detalhes-grade {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px; margin-bottom: 20px;
        }
        .detalhe-campo {
            min-width: 0; padding: 12px; border: 1px solid #e5e7eb;
            border-radius: 8px; overflow-wrap: anywhere;
        }
        .detalhe-campo strong {
            display: block; color: #6b7280; font-size: 12px;
            margin-bottom: 6px;
        }
        .detalhe-mensagem {
            white-space: pre-wrap; overflow-wrap: anywhere;
            background: #f8fafc; border-radius: 8px;
            padding: 14px; margin: 8px 0 20px;
        }
        .detalhe-imagem {
            display: block; max-width: 100%; max-height: 320px;
            object-fit: contain; margin: 12px 0 20px;
        }
        @media (max-width: 600px) {
            .detalhes-grade { grid-template-columns: 1fr; }
            .modal-conteudo { padding: 16px; }
        }

    </style>
</head>
<body>
    <header>
        <h1>BotPromos</h1>
        <span><span class="online">● ONLINE</span> Dashboard</span>
    </header>

    <main>
        <section class="cards">
            <div class="card"><small>Promoções cadastradas</small><strong id="total">-</strong></div>
            <div class="card"><small>Promoções com cupom</small><strong id="cupons">-</strong></div>
            <div class="card"><small>Lojas identificadas</small><strong id="lojas">-</strong></div>
        </section>

        <section class="filtros">
            <input id="busca" type="text" placeholder="Pesquisar produto, canal, loja ou cupom">
            <select id="loja">
                <option value="">Todas as lojas</option>
            </select>
            <select id="cupom">
                <option value="todos">Todos os cupons</option>
                <option value="com">Com cupom</option>
                <option value="sem">Sem cupom</option>
            </select>
            <input id="data_inicio" type="date" aria-label="Data inicial" title="Data inicial">
            <input id="data_fim" type="date" aria-label="Data final" title="Data final">
            <input id="preco_min" type="number" min="0" step="0.01" placeholder="Preço mínimo (R$)">
            <input id="preco_max" type="number" min="0" step="0.01" placeholder="Preço máximo (R$)">
            <button onclick="carregar()">Filtrar</button>
        </section>

        <div class="acoes">
            <button onclick="limparFiltros()">Limpar filtros</button>
        </div>

        <div id="resultado" class="resultado">Carregando promoções...</div>

        <section class="tabela">
            <div class="tabela-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Promoção</th>
                            <th>Loja</th>
                            <th>Preço</th>
                            <th>Cupom</th>
                            <th>Link</th>
                            <th>Detalhes</th>
                        </tr>
                    </thead>
                    <tbody id="lista">
                        <tr><td colspan="7" class="muted">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modalDetalhes" class="modal-detalhes" hidden
         role="dialog" aria-modal="true" aria-labelledby="tituloDetalhes">
        <div class="modal-conteudo">
            <div class="modal-cabecalho">
                <h2 id="tituloDetalhes">Detalhes da promo??o</h2>
                <button type="button" onclick="fecharDetalhes()" aria-label="Fechar">Fechar ?</button>
            </div>
            <div id="conteudoDetalhes">Carregando...</div>
        </div>
    </div>


    <script>
        let lojasCarregadas = false;

        async function carregar() {
            const busca = document.getElementById("busca").value.trim();
            const loja = document.getElementById("loja").value;
            const cupom = document.getElementById("cupom").value;
            const dataInicio = document.getElementById("data_inicio").value;
            const dataFim = document.getElementById("data_fim").value;
            const precoMin = document.getElementById("preco_min").value;
            const precoMax = document.getElementById("preco_max").value;

            if (precoMin && precoMax && Number(precoMin) > Number(precoMax)) {
                document.getElementById("resultado").textContent =
                    "O preço mínimo não pode ser maior que o máximo.";
                return;
            }

            const parametros = new URLSearchParams({
                busca,
                loja,
                cupom,
                data_inicio: dataInicio,
                data_fim: dataFim,
                preco_min: precoMin,
                preco_max: precoMax
            });

            const tabela = document.getElementById("lista");
            document.getElementById("resultado").textContent = "Carregando promoções...";

            try {
                const [resumoResposta, listaResposta] = await Promise.all([
                    fetch("/api/resumo"),
                    fetch("/api/promocoes?" + parametros.toString())
                ]);

                if (!resumoResposta.ok || !listaResposta.ok) {
                    throw new Error("Não foi possível carregar os dados.");
                }

                const resumo = await resumoResposta.json();
                const dados = await listaResposta.json();

                document.getElementById("total").textContent = resumo.total;
                document.getElementById("cupons").textContent = resumo.cupons;
                document.getElementById("lojas").textContent = resumo.lojas;

                if (!lojasCarregadas) {
                    const seletor = document.getElementById("loja");
                    resumo.opcoes_lojas.forEach(nome => {
                        const opcao = document.createElement("option");
                        opcao.value = nome;
                        opcao.textContent = nome;
                        seletor.appendChild(opcao);
                    });
                    lojasCarregadas = true;
                }

                document.getElementById("resultado").textContent =
                    dados.items.length + " promoção(ões) encontrada(s). Exibindo no máximo 200.";

                if (!dados.items.length) {
                    tabela.innerHTML = '<tr><td colspan="7" class="muted">Nenhuma promoção encontrada.</td></tr>';
                    return;
                }

                tabela.innerHTML = dados.items.map(promocao => `
                    <tr>
                        <td>${escapar(promocao.data || "-")}<br><span class="muted">${escapar(promocao.canal || "-")}</span></td>
                        <td class="mensagem">${escapar((promocao.mensagem || "").slice(0, 500))}</td>
                        <td>${escapar(promocao.loja || "-")}</td>
                        <td class="preco">${escapar(promocao.preco || "-")}</td>
                        <td class="cupom">${escapar(promocao.cupom || "-")}</td>
                        <td>${criarLink(promocao.link)}</td>
                        <td><button type="button" onclick="verDetalhes(${Number(promocao.id)})">Ver detalhes</button></td>
                    </tr>
                `).join("");
            } catch (erro) {
                document.getElementById("resultado").textContent = "Erro ao carregar as promoções.";
                tabela.innerHTML = '<tr><td colspan="7" class="muted">Verifique se o servidor está funcionando e tente novamente.</td></tr>';
                console.error(erro);
            }
        }

        function limparFiltros() {
            document.getElementById("busca").value = "";
            document.getElementById("loja").value = "";
            document.getElementById("cupom").value = "todos";
            document.getElementById("data_inicio").value = "";
            document.getElementById("data_fim").value = "";
            document.getElementById("preco_min").value = "";
            document.getElementById("preco_max").value = "";
            carregar();
        }

        function escapar(valor) {
            return String(valor).replace(/[&<>"']/g, caractere => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            })[caractere]);
        }

        function criarLink(link) {
            if (!link) return "-";

            try {
                const url = new URL(link);
                if (url.protocol !== "https:" && url.protocol !== "http:") return "-";
                const ancora = document.createElement("a");
                ancora.href = url.href;
                ancora.target = "_blank";
                ancora.rel = "noopener noreferrer";
                ancora.textContent = "Abrir ↗";
                return ancora.outerHTML;
            } catch {
                return "-";
            }
        }


        function campoDetalhe(rotulo, valor) {
            const exibicao = valor === null || valor === undefined || valor === ""
                ? "-"
                : String(valor);
            return `<div class="detalhe-campo">
                <strong>${escapar(rotulo)}</strong>
                <div>${escapar(exibicao)}</div>
            </div>`;
        }

        function criarImagemDetalhe(valor) {
            if (!valor) return "";
            try {
                const url = new URL(valor);
                if (url.protocol !== "https:" && url.protocol !== "http:") return "";
                return `<img class="detalhe-imagem" src="${escapar(url.href)}"
                    alt="Imagem da promo??o" loading="lazy">`;
            } catch {
                return "";
            }
        }

        async function verDetalhes(id) {
            const modal = document.getElementById("modalDetalhes");
            const conteudo = document.getElementById("conteudoDetalhes");
            modal.hidden = false;
            conteudo.textContent = "Carregando detalhes...";

            try {
                const resposta = await fetch("/api/promocoes/" + encodeURIComponent(id));
                const dados = await resposta.json();

                if (!resposta.ok || !dados.item) {
                    throw new Error(dados.erro || "N?o foi poss?vel carregar a promo??o.");
                }

                const p = dados.item;
                conteudo.innerHTML = `
                    <div class="detalhes-grade">
                        ${campoDetalhe("ID da promo??o", p.id)}
                        ${campoDetalhe("ID do Telegram", p.telegram_id)}
                        ${campoDetalhe("Canal de origem", p.canal)}
                        ${campoDetalhe("Data", p.data)}
                        ${campoDetalhe("Loja", p.loja)}
                        ${campoDetalhe("Pre?o registrado", p.preco)}
                        ${campoDetalhe("Cupom", p.cupom)}
                        <div class="detalhe-campo">
                            <strong>Link da oferta</strong>
                            <div>${criarLink(p.link)}</div>
                        </div>
                        ${campoDetalhe("ID do produto", p.produto_id)}
                        ${campoDetalhe("Assinatura da mensagem", p.assinatura_mensagem)}
                        ${campoDetalhe("Chave do produto", p.chave_produto_texto)}
                        ${campoDetalhe("Imagem cadastrada", p.imagem)}
                    </div>
                    <h3>Mensagem completa</h3>
                    <div class="detalhe-mensagem">${escapar(p.mensagem || "Sem mensagem cadastrada.")}</div>
                    ${criarImagemDetalhe(p.imagem)}
                `;
            } catch (erro) {
                conteudo.textContent = "Erro ao carregar os detalhes: " + erro.message;
            }
        }

        function fecharDetalhes() {
            document.getElementById("modalDetalhes").hidden = true;
        }

        document.getElementById("modalDetalhes").addEventListener("click", evento => {
            if (evento.target.id === "modalDetalhes") fecharDetalhes();
        });

        document.addEventListener("keydown", evento => {
            if (evento.key === "Escape") fecharDetalhes();
        });

        document.getElementById("busca").addEventListener("keydown", evento => {
            if (evento.key === "Enter") carregar();
        });

        carregar();
        setInterval(carregar, 15000);
    </script>
</body>
</html>
