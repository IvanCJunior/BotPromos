<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · BotPromos</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5fa;font-family:Arial,sans-serif;color:#172033}.painel{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #e4e8f0;border-radius:16px;padding:30px;box-shadow:0 12px 35px #17203312}h1{margin:0 0 8px;font-size:26px}.sub{color:#667085;margin:0 0 24px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #cfd5df;border-radius:9px;font-size:15px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#172033;color:white;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.6}.erro{display:none;margin-top:14px;padding:11px;border-radius:8px;background:#fff0f0;color:#a12626;font-size:13px}.rodape{margin-top:20px;color:#98a2b3;font-size:12px;text-align:center}
</style></head><body><main class="painel"><h1>BotPromos</h1><p class="sub">Entre para acessar o painel de promoções.</p><form id="form"><label for="usuario">Usuário</label><input id="usuario" autocomplete="username" required autofocus><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required><button id="entrar">Entrar</button><div class="erro" id="erro" role="alert"></div></form><div class="rodape">Acesso local · BotPromos AC3</div></main>
<script>
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('entrar'),m=document.getElementById('erro');b.disabled=true;b.textContent='Entrando...';m.style.display='none';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:document.getElementById('usuario').value,senha:document.getElementById('senha').value})});const d=await r.json();if(!r.ok)throw new Error(d.erro||'Falha no login');location.href='/';}catch(err){m.textContent=err.message;m.style.display='block';}finally{b.disabled=false;b.textContent='Entrar';}});
</script></body></html>
